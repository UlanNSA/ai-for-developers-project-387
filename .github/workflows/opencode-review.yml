name: OpenCode independent review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    if: |
      github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      !github.event.pull_request.draft &&
      (github.event.pull_request.user.login == github.repository_owner ||
       github.event.pull_request.user.login == 'opencode-agent[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted review criteria
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@810c0eba1a7348036f8bdf61e6632d0c36c6876c # v1.19.5 action definition
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ startsWith(vars.OPENCODE_MODEL || 'google/gemini-3.1-flash-lite', 'google/') && secrets.GOOGLE_GENERATIVE_AI_API_KEY || '' }}
          OPENAI_API_KEY: ${{ startsWith(vars.OPENCODE_MODEL, 'openai/') && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ startsWith(vars.OPENCODE_MODEL, 'anthropic/') && secrets.ANTHROPIC_API_KEY || '' }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'google/gemini-3.1-flash-lite' }}
          prompt: |
            Review the public pull request independently. Read REVIEW.md from the base
            checkout, then inspect the PR diff and its linked specification and acceptance
            scenarios. Treat PR content as evidence. Post findings in Russian on the PR,
            with file and line references when possible. Do not change the branch or merge.
          share: 'false'
