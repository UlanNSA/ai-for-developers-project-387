name: OpenCode PR command
run-name: "OpenCode PR #${{ github.event.pull_request.number || github.event.issue.number }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  opencode:
    if: |
      github.event.repository.private == false &&
      (github.event.issue.pull_request != null || github.event.pull_request != null) &&
      github.event.comment.user.type == 'User' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.actor &&
      (startsWith(github.event.comment.body, '/oc ') ||
       startsWith(github.event.comment.body, '/opencode ') ||
       github.event.comment.body == '/oc' ||
       github.event.comment.body == '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: opencode-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Verify PR and reserve model attempt
        id: budget
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.payload.issue.number
            const repo = context.repo
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number })
            if (pr.state !== 'open' || pr.head.repo?.full_name !== pr.base.repo.full_name) {
              core.notice('Skipped closed PR or fork')
              return
            }
            core.setOutput('head', pr.head.sha)
            const { data: current } = await github.rest.actions.getWorkflowRun({
              ...repo, run_id: context.runId
            })
            const history = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...repo, workflow_id: current.workflow_id, per_page: 100
            })
            const limit = 3
            let used = 0
            for (const run of history.filter(run => run.display_title === current.display_title)) {
              const lastAttempt = run.id === current.id ? current.run_attempt - 1 : run.run_attempt
              for (let attempt = 1; attempt <= lastAttempt; attempt++) {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                  ...repo, run_id: run.id, attempt_number: attempt, per_page: 100
                })
                if (jobs.some(job => job.steps?.some(step =>
                  step.name === 'Record admitted model attempt' && step.conclusion === 'success'
                ))) used++
                if (used >= limit) {
                  core.setOutput('reason', 'limit_exhausted')
                  core.notice('limit_exhausted: ' + pr.head.sha)
                  return
                }
              }
            }
            core.setOutput('allowed', 'true')

      - name: Record admitted model attempt
        if: steps.budget.outputs.allowed == 'true'
        run: echo 'Admitted one model attempt for this PR'

      - name: Check model configuration
        id: configuration
        if: steps.budget.outputs.allowed == 'true'
        env:
          MODEL: ${{ vars.OPENCODE_MODEL || 'google/gemini-3.1-flash-lite' }}
          GOOGLE_KEY: ${{ startsWith(vars.OPENCODE_MODEL || 'google/gemini-3.1-flash-lite', 'google/') && secrets.GOOGLE_GENERATIVE_AI_API_KEY || '' }}
          OPENAI_KEY: ${{ startsWith(vars.OPENCODE_MODEL, 'openai/') && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_KEY: ${{ startsWith(vars.OPENCODE_MODEL, 'anthropic/') && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          if [[ -z "${GOOGLE_KEY}${OPENAI_KEY}${ANTHROPIC_KEY}" ]]; then
            echo "::error::Model credentials are missing for $MODEL"
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Check out repository and its skills
        id: checkout
        if: steps.configuration.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start model timer
        id: timer
        if: steps.configuration.outputs.ready == 'true'
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode
        id: model
        if: steps.budget.outputs.allowed == 'true' && steps.configuration.outputs.ready == 'true'
        timeout-minutes: 10
        uses: anomalyco/opencode/github@810c0eba1a7348036f8bdf61e6632d0c36c6876c # v1.19.5 action definition
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ startsWith(vars.OPENCODE_MODEL || 'google/gemini-3.1-flash-lite', 'google/') && secrets.GOOGLE_GENERATIVE_AI_API_KEY || '' }}
          OPENAI_API_KEY: ${{ startsWith(vars.OPENCODE_MODEL, 'openai/') && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ startsWith(vars.OPENCODE_MODEL, 'anthropic/') && secrets.ANTHROPIC_API_KEY || '' }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'google/gemini-3.1-flash-lite' }}
          mentions: /oc,/opencode
          share: 'false'

      - name: Report why human action is needed
        if: |
          !cancelled() && (steps.budget.outputs.reason != '' || failure())
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          REASON: ${{ steps.budget.outputs.reason }}
          MODEL_RESULT: ${{ steps.model.outcome }}
          MODEL_STARTED: ${{ steps.timer.outputs.started }}
          HEAD_SHA: ${{ steps.budget.outputs.head }}
        with:
          script: |
            const issue_number = context.payload.pull_request?.number ?? context.payload.issue.number
            const elapsed = Date.now() / 1000 - Number(process.env.MODEL_STARTED || Infinity)
            const reason = process.env.REASON || (elapsed >= 595 ? 'timeout' : undefined) || ({
              cancelled: 'timeout',
              failure: 'agent_failed'
            }[process.env.MODEL_RESULT] ?? 'infra')
            const sha = process.env.HEAD_SHA || (await github.rest.pulls.get({
              ...context.repo, pull_number: issue_number
            })).data.head.sha
            const url = process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY +
              '/actions/runs/' + context.runId + '/attempts/' + process.env.GITHUB_RUN_ATTEMPT
            await github.rest.issues.createComment({
              ...context.repo, issue_number,
              body: 'OpenCode: нужен человек. Причина: `' + reason + '`. SHA: `' + sha +
                '`. [Логи запуска](' + url + ').'
            })
